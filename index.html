<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Арифметический калькулятор</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><main><h1>Арифметический калькулятор</h1><p>Введите два числа и выберите операцию. Результат появится на следующей странице.</p><form action="result.html" method="get" id="calc"><label>Первое число<input name="a" inputmode="decimal" placeholder="Например, 12,5" required></label><label>Второе число<input name="b" inputmode="decimal" placeholder="Например, 2" required></label><fieldset><legend>Операция</legend><label><input type="radio" name="op" value="+" checked> Сложение</label><label><input type="radio" name="op" value="-"> Вычитание</label><label><input type="radio" name="op" value="*"> Умножение</label><label><input type="radio" name="op" value="/"> Деление</label></fieldset><p id="error" role="alert"></p><button type="submit">Вычислить</button></form></main></body></html>
